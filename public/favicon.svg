<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradBulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="gradBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with soft 3D shadow -->
  <circle cx="32" cy="32" r="30" fill="#38BDF8" />
  <circle cx="32" cy="32" r="28" fill="#0284C7" />
  <circle cx="32" cy="30" r="26" fill="#0EA5E9" />
  
  <!-- Glowing bulb -->
  <circle cx="32" cy="24" r="16" fill="url(#gradBulb)" filter="url(#glow)" />
  <path d="M 22 26 C 22 34 26 36 26 40 L 38 40 C 38 36 42 34 42 26 Z" fill="url(#gradBulb)" />
  
  <!-- Bulb screw base -->
  <rect x="27" y="40" width="10" height="4" rx="2" fill="url(#gradBase)" />
  <rect x="28" y="44" width="8" height="4" rx="2" fill="url(#gradBase)" />
  <circle cx="32" cy="49" r="2.5" fill="#475569" />

  <!-- Filament reflection highlight -->
  <path d="M 26 18 A 8 8 0 0 1 34 14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <!-- Sparkles -->
  <path d="M 32 4 L 32 8" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 48 14 L 45 17" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 16 14 L 19 17" stroke="#FEF08A" stroke-width="2.5" stroke-linecap="round" />
</svg>
